<div class="segment-tabs" role="group" [attr.aria-label]="label()">
  @for (tab of tabs(); track tab.label) {
    <button
      class="segment-tab"
      type="button"
      [class.segment-tab-active]="value() === tab.value"
      [class.segment-tab-danger]="tab.tone === 'danger'"
      [class.segment-tab-warning]="tab.tone === 'warning'"
      [attr.aria-pressed]="value() === tab.value"
      (click)="select(tab.value)"
    >
      <span>{{ tab.label }}</span>

      @if (tab.count) {
        <nz-badge [nzCount]="tab.count" />
      }
    </button>
  }
</div>
