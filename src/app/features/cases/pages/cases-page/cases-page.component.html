<section class="cases-page">
  <div class="flex items-start justify-between gap-6">
    <div>
      <h1 class="m-0 text-3xl font-bold tracking-tight text-slate-950">Cases</h1>
      <p class="mt-2 text-sm text-slate-500">Manage customer cases, SLA risks and support workflow.</p>
    </div>

    <div class="flex items-center gap-3">
      <button nz-button type="button">
        <i nz-icon nzType="export"></i>
        Export
      </button>

      <button nz-button nzType="primary" type="button">
        <i nz-icon nzType="plus"></i>
        Create case
      </button>
    </div>
  </div>

  <fd-cases-status-tabs [selectedStatus]="table.filters().status" (selectedStatusChange)="updateStatus($event)" />

  <fd-cases-filters [filters]="table.filters()" (filtersChange)="table.updateFilters($event)" />

  @if (table.isInitialLoading()) {
    <div class="flex min-h-80 items-center justify-center rounded-2xl border border-slate-200 bg-white">
      <nz-spin nzSize="large" />
    </div>
  } @else {
    <fd-cases-table class="cases-table-wrapper" (rowAction)="handleCaseTableAction($event)" />
  }
</section>
