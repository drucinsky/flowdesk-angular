<fd-data-table [columns]="columns" [rowKey]="rowKey" [rowLabel]="rowLabel" entity="cases">
  <ng-template fdTableCell="id" let-caseItem>
    <strong class="case-id">{{ caseItem.id }}</strong>
  </ng-template>

  <ng-template fdTableCell="customer" let-caseItem>
    <div class="flex min-w-0 flex-col">
      <strong class="block truncate text-sm font-bold text-slate-950">
        {{ caseItem.customer }}
      </strong>

      <span class="mt-1 block truncate text-xs text-slate-500">
        {{ caseItem.title }}
      </span>
    </div>
  </ng-template>

  <ng-template fdTableCell="category" let-caseItem>{{ caseItem.categoryLabel }}</ng-template>

  <ng-template fdTableCell="priority" let-caseItem>
    <nz-tag [nzColor]="caseItem.priority.color">
      {{ caseItem.priority.label }}
    </nz-tag>
  </ng-template>

  <ng-template fdTableCell="status" let-caseItem>
    <nz-tag [nzColor]="caseItem.status.color">
      {{ caseItem.status.label }}
    </nz-tag>
  </ng-template>

  <ng-template fdTableCell="sla" let-caseItem>
    <span class="sla-value">{{ caseItem.sla }}</span>
  </ng-template>

  <ng-template fdTableCell="assignee" let-caseItem>{{ caseItem.assignee }}</ng-template>
  <ng-template fdTableCell="updatedAt" let-caseItem>{{ caseItem.updatedAt }}</ng-template>

  <ng-template fdTableCell="actions" let-caseItem>
    <button nz-button nzType="link" type="button" [disabled]="caseItem.statusValue === caseStatus.CLOSED" (click)="closeCase(caseItem)">
      Close
    </button>
  </ng-template>
</fd-data-table>
